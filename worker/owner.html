<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DEDUCE / Control Room</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(110deg,#C9E9E5,#DAE0F0 45%,#CAD6EE 75%,#D2DEDE);color:#370039;font:16px system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at top right,#1453a22a,transparent 60%)}main{max-width:1150px;margin:auto;padding:45px 25px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}small{letter-spacing:2px;color:#5e3476;font-size:11px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-2px;margin:25px 0 8px}p{color:#49225b;line-height:1.7}button{color:#fbeef5;background:#370039;border:1px solid #ab85b8;border-radius:28px;padding:13px 22px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:35px 0}.stat,.panel{border:1px solid #8d54994d;background:#49225b;color:#f5f0f8;border-radius:16px;padding:25px}.stat strong{display:block;font-size:40px;font-weight:500;margin:12px 0}.stat span{color:#dae0f0;font-size:13px}table{color:#f5f0f8;border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{color:#5e3476;font-weight:500}td,th{padding:16px 8px;border-bottom:1px solid #ffffff0f}td:first-child{width:55%}#status{font-size:12px}.scroll{overflow:auto}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stat{padding:20px}header{align-items:start}td,th{min-width:85px}}
.panel p,.panel th{color:#dae0f0}.panel h2{color:#f5f0f8}</style></head><body><main><header><small>DEDUCE / OWNER ACCESS</small><button id="language">Bahasa Indonesia</button></header><h1 id="title">The control room.</h1><p id="intro">Player accounts and investigation activity.</p><div id="status">Connecting…</div><p><button id="claim-owner">Use my reserved ID · PEARL777</button> <span id="owner-status"></span></p><section id="metrics" class="stats"></section><section class="panel"><header><h2 id="case-title">Case activity</h2><button id="refresh">Refresh</button></header><p id="explain">Players = distinct investigator profiles per case. Active and completed counts include separate attempts.</p><div class="scroll"><table><thead id="head"></thead><tbody id="cases"></tbody></table></div></section></main><script>
let lang='en',data=null,busy=false;const t=(a,b)=>lang==='id'?b:a;const key=location.hash.slice(1);if(key){sessionStorage.setItem('deduce-owner-key',key);history.replaceState(null,'','/control-room')}const token=sessionStorage.getItem('deduce-owner-key');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.documentElement.lang=lang;document.getElementById('language').textContent=t('Bahasa Indonesia','English');document.getElementById('title').textContent=t('The control room.','Ruang kendali.');document.getElementById('intro').textContent=t('Player accounts and investigation activity.','Akun pemain serta aktivitas investigasi.');document.getElementById('case-title').textContent=t('Case activity','Aktivitas kasus');document.getElementById('refresh').textContent=t('Refresh','Perbarui');document.getElementById('claim-owner').textContent=t('Use my reserved ID · PEARL777','Gunakan ID khusus saya · PEARL777');document.getElementById('explain').textContent=t('Players = distinct investigator profiles per case. Active and completed counts include separate attempts.','Pemain = profil detektif unik per kasus. Jumlah aktif serta selesai mencakup percobaan terpisah.');if(!data)return;const s=data.summary;document.getElementById('metrics').innerHTML=[[s.profiles,t('Investigator profiles','Profil detektif')],[s.accounts,t('Returning-player accounts','Akun pemain terdaftar')],[s.players,t('Have started a case','Sudah memulai kasus')],[s.online,t('Online · last 5 minutes','Daring · 5 menit terakhir')],[s.daily,t('Active · last 24 hours','Aktif · 24 jam terakhir')],[data.cases.reduce((n,c)=>n+(c.completed||0),0),t('Completed investigations','Investigasi selesai')]].map(([v,label])=>`<article class="stat"><strong>${v||0}</strong><span>${label}</span></article>`).join('');document.getElementById('head').innerHTML='<tr>'+[t('Case','Kasus'),t('Players','Pemain'),t('Active attempts','Percobaan aktif'),t('Completed','Selesai')].map(x=>'<th>'+x+'</th>').join('')+'</tr>';document.getElementById('cases').innerHTML=data.cases.map(c=>`<tr><td>${String(c.id).padStart(3,'0')} / ${esc(c.title[lang])}</td><td>${c.players||0}</td><td>${c.active||0}</td><td>${c.completed||0}</td></tr>`).join('');document.getElementById('status').textContent=t('Updated ','Diperbarui ')+new Date(data.at).toLocaleTimeString(lang==='id'?'id-ID':'en-GB')+' · '+t('Auto-refresh every 30 seconds. Online means a visible page seen in the last five minutes.','Diperbarui otomatis setiap 30 detik. Daring berarti halaman terlihat dalam lima menit terakhir.')}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/owner',{headers:{Authorization:'Bearer '+(token||'')}}),v=await r.json();if(!r.ok)throw Error(v.error[lang]);data=v;render()}catch(e){document.getElementById('status').textContent=e.message}finally{busy=false}}
document.getElementById('claim-owner').onclick=async()=>{try{const r=await fetch('/api/owner-claim',{method:'POST',headers:{Authorization:'Bearer '+(token||'')}}),v=await r.json();if(!r.ok)throw Error(v.error[lang]);document.getElementById('owner-status').textContent=v.name+' / '+v.username;refresh()}catch(e){document.getElementById('owner-status').textContent=e.message}};
document.getElementById('language').onclick=()=>{lang=lang==='en'?'id':'en';render()};document.getElementById('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},30000);
</script></body></html>
