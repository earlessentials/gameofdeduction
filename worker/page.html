$$('[data-archive]').forEach(b=>b.onclick=()=>openModal('confirm',{title:t('Archive this investigation?','Arsipkan investigasi ini?'),message:t('Your progress is preserved. You can resume when a desk slot is available.','Progres kamu tetap tersimpan. Kamu bisa melanjutkan saat slot meja tersedia.'),confirm:async()=>{await perform('archive',{attempt:b.dataset.archive},false);current=null;setRoute('bureau');openModal('manage')}}));
$$('[data-unlink]').forEach(b=>b.onclick=async()=>{const links=current.attempt.links.filter((_,i)=>i!==Number(b.dataset.unlink));await perform('notes',{notes:current.attempt.notes,links},false);current.attempt.links=links;renderModal()});
$$('[data-action]').forEach(b=>b.onclick=async()=>{const a=b.dataset.action;if(a==='enter')return enter();if(a==='menu'){menuOpen=!menuOpen;const menu=$('#mobile-menu');menu.hidden=!menuOpen;menu.classList.toggle('open',menuOpen);const toggle=$('.menu-toggle');toggle.setAttribute('aria-expanded',String(menuOpen));toggle.setAttribute('aria-label',menuOpen?t('Close navigation','Tutup navigasi'):t('Open navigation','Buka navigasi'));toggle.textContent=menuOpen?'×':'☰';return}if(a==='compare')return openModal('compare');if(a==='text-size'){docZoom=!docZoom;render();return}if(a==='completion-card')return downloadCompletion();if(a==='preview-confirm'){previewFeedback=previewChoice===0?'correct':'retry';$('#preview-feedback').innerHTML=`<div class="feedback ${previewChoice===0?'success':''}">${previewReasoning(previewChoice)}</div><a class="textbtn" href="/cases/001">${t('Continue into a full investigation','Lanjutkan ke investigasi lengkap')}</a>`;return}if(a==='reset-filters'){selectedVolume=0;selectedFilter=-1;caseSearch='';render();return}if(a==='login')return openModal('login');if(a==='account-continue'){closeModal();if(current&&route==='workspace'){render();return}if(pendingCase){const id=pendingCase;pendingCase=null;await start(id)}else setRoute('bureau');return}if(a==='download-id'){const blob=new Blob(['DEDUCE\n'+profile.username+'\n'+location.origin+'\n'+t('Keep this player ID private. Sign in with it to reopen your progress.','Simpan ID pemain ini secara pribadi. Masuk dengan ID ini untuk membuka progres kamu.')],{type:'text/plain'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='DEDUCE-Player-ID.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='logout')return openModal('confirm',{title:t('Sign out of this device?','Keluar dari perangkat ini?'),message:t('Keep your player ID so you can return to these investigations.','Simpan ID pemain agar kamu bisa kembali ke investigasi ini.'),confirm:async()=>{clearTimeout(window.noteTimer);if(await perform('logout',{},false)){current=null;selected={};localStorage.removeItem('archive-current');closeModal();setRoute('home')}}});if(a==='close'||a==='cancel')return closeModal();if(a==='about'||a==='manage')return openModal(a);if(a==='settings'){avatar=profile.avatar||0;return openModal(profile.name?'settings':'onboard')}if(a==='board'||a==='all-evidence')return openModal(a);if(a==='zoom'){modal.zoom=!modal.zoom;return renderModal()}if(a==='confirm'){const cb=modal?.confirm;if(!cb)return;b.disabled=true;return cb()}if(a==='advance'){const v=await perform('advance');if(v){viewerId=v.evidence.find(e=>e.stage===v.attempt.stage)?.id||null;if(viewerId)localStorage.setItem('deduce-evidence-'+v.attempt.id,viewerId);workspaceTab='evidence';render();window.scrollTo({top:100,behavior:'smooth'})}}if(a==='sound')toggleSound();if(a==='certificate')certificate()});
const form=$('#profile-form');if(form)form.onsubmit=async e=>{e.preventDefault();const name=$('#alias').value.trim(),language=$('#pref-language').value,low=$('#intensity').checked;const v=await perform('profile',{name,avatar,language,prefix:$('#player-prefix')?.value},false);if(v){lang=language;localStorage.setItem('archive-language',lang);localStorage.setItem('archive-low',low?'1':'0');document.body.classList.toggle('low',low);const setup=modal.type==='onboard';closeModal();render();if(setup){if(pendingCase){const id=pendingCase;pendingCase=null;await start(id)}openModal('account-ready')}else toast(t('Settings saved.','Pengaturan tersimpan.'))}};
const notes=$('#notes');if(notes)notes.oninput=()=>{const id=current.attempt.id;current.attempt.notes=notes.value;notesDirty.set(id,notes.value);$('#saved').textContent=t('Saving…','Menyimpan…');clearTimeout(window.noteTimer);window.noteTimer=setTimeout(async()=>{try{await flushNotes()}catch(e){if($('#saved'))$('#saved').textContent=t('Not saved yet. Retry before leaving.','Belum tersimpan. Coba lagi sebelum keluar.');toast(e.message)}},650)};

const link=$('#link-form');if(link)link.onsubmit=async e=>{e.preventDefault();const x=$('#link-0').value,y=$('#link-1').value;if(x===y)return toast(t('Choose two different clues.','Pilih dua petunjuk berbeda.'));const links=[...current.attempt.links];if(!links.some(([a,b])=>a===x&&b===y||a===y&&b===x))links.push([x,y]);await perform('notes',{notes:current.attempt.notes,links},false);current.attempt.links=links;renderModal()};
}
function toggleSound(){sound=!sound;if(sound){audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const buffer=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate);const data=buffer.getChannelData(0);let last=0;for(let i=0;i<data.length;i++){last=(last+Math.random()*.02-.01)*.995;data[i]=last*.7}window.noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;const g=audio.createGain();g.gain.value=.13;noise.connect(g);g.connect(audio.destination);noise.start()}else window.noise?.stop();render()}
function certificate(volume=1){const c=document.createElement('canvas');c.width=1600;c.height=1100;const x=c.getContext('2d');x.fillStyle='#1f1a38';x.fillRect(0,0,1600,1100);x.strokeStyle='#8d5499';x.lineWidth=3;x.strokeRect(50,50,1500,1000);x.textAlign='center';x.fillStyle='#b987c5';x.font='22px monospace';x.fillText('DEDUCE · VOLUME '+roman(volume),800,160);x.fillStyle='#fbeef5';x.font='64px Georgia';x.fillText(t('Certificate of Deduction','Sertifikat Deduksi'),800,300);x.font='32px Georgia';x.fillText(t('Awarded to Detective','Diberikan kepada Detektif'),800,390);x.font='76px Georgia';x.fillText(profile.name,800,510);x.font='30px Georgia';x.fillText(t('Six investigations. Every conclusion earned.','Enam investigasi. Setiap kesimpulan diraih dengan nalar.'),800,610);x.fillStyle='#c69bd0';x.font='22px monospace';let done=[];for(let i=(volume-1)*6+1;i<=volume*6;i++)done.push([...profile.attempts].reverse().find(a=>a.caseId===i&&a.status==='COMPLETED'));done.forEach((a,i)=>{const xx=235+i*225;x.strokeRect(xx-70,710,140,100);x.fillText(caseNo(a.caseId)+' / ✓',xx,750);x.fillText(Math.max(0,100-a.errors*3-a.hints.length*4)+'/100',xx,790)});const total=done.reduce((n,a)=>n+a.submissions,0),right=done.reduce((n,a)=>n+a.answers.length,0);x.fillText(t('MASTER OF DEDUCTION','AHLI DEDUKSI')+' · '+Math.round(right/total*100)+'%',800,895);x.font='18px monospace';x.fillText(new Date().toLocaleDateString(lang==='id'?'id-ID':'en-GB'),800,960);const a=document.createElement('a');a.download='DEDUCE-Volume-'+volume+'-Certificate.png';a.href=c.toDataURL();a.click()}
document.addEventListener('keydown',e=>{if(!modal){if(menuOpen&&e.key==='Escape'){$('[data-action="menu"]')?.click();$('.menu-toggle')?.focus()}return}if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const f=$$('#overlay button:not(:disabled),#overlay input,#overlay select,#overlay textarea,#overlay a'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('focus',async()=>{if(busy||syncPending||!profile||Date.now()-lastSync<15000)return;syncPending=true;const epoch=identityEpoch;try{const before=JSON.stringify(profile.attempts);const [next,nextView]=await Promise.all([api('get'),current?api('view',{attempt:current.attempt.id}).catch(()=>null):Promise.resolve(null)]);if(epoch!==identityEpoch)return;profile=next;if(nextView)current=nextView;if(current?.attempt.status==='ARCHIVED'){current=null;route='bureau'}if(before!==JSON.stringify(profile.attempts)&&!$('#notes')?.matches(':focus'))render();lastSync=Date.now()}catch{}finally{syncPending=false}});

async function navigateFromLocation(){const r=currentRoute();if(['home','bureau','cases','profile','hollow','network','how-to-play'].includes(r)||/^case-(?:[1-9]|1[0-9]|2[0-4])$/.test(r)||r==='workspace'){try{if(notesDirty.size)await flushNotes();route=r;menuOpen=false;if(r==='workspace'&&!current&&localStorage.getItem('archive-current'))current=await api('view',{attempt:localStorage.getItem('archive-current')});render()}catch(e){toast(e.message)}}}
window.addEventListener('hashchange',navigateFromLocation);window.addEventListener('popstate',navigateFromLocation);
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('page-hidden',document.hidden));
window.addEventListener('beforeunload',()=>{for(const [attempt,notes] of notesDirty)fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notes',attempt,notes}),keepalive:true})});

(async()=>{try{profile=await api('get');if(profile.language)lang=profile.name?profile.language:lang;avatar=profile.avatar||0;document.body.classList.toggle('low',localStorage.getItem('archive-low')==='1');const r=currentRoute();if(['home','bureau','cases','profile','hollow','network','how-to-play'].includes(r)||/^case-(?:[1-9]|1[0-9]|2[0-4])$/.test(r))route=r;if(r==='workspace'&&localStorage.getItem('archive-current')){try{current=await api('view',{attempt:localStorage.getItem('archive-current')});route=current.attempt.status==='ARCHIVED'?'bureau':'workspace'}catch{route='bureau'}}render()}catch(e){$('#app').innerHTML='<div class="loading">'+esc(e.message)+'<br><button class="outline" onclick="location.reload()">'+t('Retry','Coba lagi')+'</button></div>'}})();
setInterval(()=>{if(profile?.name&&!document.hidden&&!busy)api('presence').catch(()=>{})},120000);
</script></body></html>
