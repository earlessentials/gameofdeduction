async function api(action,data={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const read=action==='get'||action==='view'||action==='presence';const r=await fetch('/api/'+(action==='get'?'profile':action==='presence'?'presence':action==='view'?'case?attempt='+encodeURIComponent(data.attempt):'action'),{signal:controller.signal,...(read?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})})});let v;try{v=await r.json()}catch{throw new Error(t('The archive is temporarily unavailable. Please try again.','Arsip sedang tidak tersedia. Coba lagi.'))}if(!r.ok)throw new Error(tr(v.error));return v}catch(e){if(e.name==='AbortError')throw new Error(t('The connection took too long. Please try again.','Koneksi terlalu lama. Coba lagi.'));if(e instanceof TypeError)throw new Error(t('Check your connection, then try again.','Periksa koneksi kamu, lalu coba lagi.'));throw e}finally{clearTimeout(timer)}}

function toast(m){$('#notice').innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#notice').innerHTML='',5500)}
function mergeAttempt(attempt){if(!profile||!attempt)return;const i=profile.attempts.findIndex(a=>a.id===attempt.id);if(i<0)profile.attempts.push(attempt);else profile.attempts[i]=attempt;if(attempt.status==='COMPLETED'){const next=profile.cases.find(c=>c.id===attempt.caseId+1&&c.series);if(next)next.unlocked=true}}
async function perform(action,data={},rerender=true){if(busy){const queued={attempt:current?.attempt.id,...data};return new Promise(resolve=>pendingActions.push(()=>perform(action,queued,rerender).then(resolve)))}busy=true;if(action==='login'||action==='logout')identityEpoch++;$('#app')?.setAttribute('aria-busy','true');try{if(action!=='notes')await flushNotes();const v=await api(action,{attempt:current?.attempt.id,...data});if(v.attempt)current=v;if(v.view)current=v.view;if(v.cases){const username=v.username||profile?.username;profile={...v,username}}else if(action==='login'||action==='logout')profile=await api('get');else if(action==='claimAccount')profile.username=v.username;if((v.attempt||v.view)&&current)mergeAttempt(current.attempt);if(v.network)profile.network=v.network;else if(action.startsWith('network')&&v.nodes)profile.network=v;lastSync=Date.now();if(rerender)render();return v}catch(e){toast(e.message)}finally{busy=false;$('#app')?.setAttribute('aria-busy','false');const next=pendingActions.shift();if(next)queueMicrotask(next)}}

async function setRoute(r){try{if(notesDirty.size)await flushNotes()}catch(e){toast(e.message);return}menuOpen=false;if(r==='workspace'&&current)localStorage.setItem('archive-current',current.attempt.id);route=r;history.pushState(null,'',routeURL(r));closeModal();render();$('#app')?.focus({preventScroll:true});window.scrollTo(0,0)}
function updateWorkspaceTab(){const workspace=$('.workspace');if(workspace)workspace.dataset.workspaceTab=workspaceTab;$$('[role="tab"][data-workspace-tab]').forEach(b=>{const on=b.dataset.workspaceTab===workspaceTab;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1})}
function routeURL(r){return r==='home'?'/':r.startsWith('case-')?'/cases/'+caseNo(Number(r.slice(5))):'/#'+r}
function currentRoute(){const hash=location.hash.slice(1);if(hash)return hash;const m=location.pathname.match(/^\/cases\/(\d{1,3})\/?$/);return m?'case-'+Number(m[1]):'home'}
function filteredCases(){return profile.cases.filter(c=>(selectedFilter<0||c.difficulty===selectedFilter)&&(!selectedVolume||c.volume===selectedVolume)&&(!caseSearch||[tr(c.title),tr(c.kind),String(c.id).padStart(3,'0')].join(' ').toLocaleLowerCase().includes(caseSearch.toLocaleLowerCase())))}
function caseCard(c){const a=[...profile.attempts].reverse().find(a=>a.caseId===c.id),done=a?.status==='COMPLETED',active=a?.status==='ACTIVE',archived=a?.status==='ARCHIVED',locked=c.unlocked===false,phase=a?Math.min(a.stage+1,(c.sceneCount||[5,5,7,7,9,9][(c.id-1)%6])+1):0,total=(c.sceneCount||[5,5,7,7,9,9][(c.id-1)%6])+1;const status=locked?t('Complete the preceding episode','Selesaikan episode sebelumnya'):done?t('✓ CASE CLOSED','✓ KASUS SELESAI'):active?t('● IN PROGRESS','● SEDANG BERJALAN'):archived?t('ARCHIVED','DIARSIPKAN'):t('READY TO INVESTIGATE','SIAP DISELIDIKI');return `<a class="case-card" href="/cases/${caseNo(c.id)}" ${active||done?`data-attempt="${a.id}"`:`data-case="${c.id}"`}><div class="case-art">${art(c.id)}<span class="case-num">${t('CASE','KASUS')} ${caseNo(c.id)}</span><span class="difficulty d${c.difficulty}">${[t('EASY','MUDAH'),t('MEDIUM','SEDANG'),t('COMPLICATED','RUMIT')][c.difficulty]}</span></div><div class="case-body"><span class="kind">${esc(tr(c.kind))}</span><h3>${esc(tr(c.title))}</h3><p>${esc(tr(c.brief))}</p><div class="case-foot"><span>${status}</span>${active||archived?`<span class="card-phase">${t('Phase','Tahap')} ${phase}/${total} · ${a.inspected.length}/${c.evidenceCount} ${t('records reviewed','catatan ditinjau')}</span><div class="progress"><i style="width:${a.stage/total*100}%"></i></div>`:''}<span class="card-action">${locked?t('View briefing','Lihat pengarahan'):done?t('Revisit case report','Tinjau laporan kasus'):active||archived?t('Resume investigation','Lanjutkan investigasi'):t('Open case file','Buka berkas kasus')}</span></div></div></a>`}
function gameplaySteps(){return `<section class="intro-strip" aria-label="${t('How to investigate','Cara menyelidiki')}">${[[t('Examine the evidence','Periksa bukti'),t('Explore witness statements, reports, photographs and case records.','Jelajahi keterangan saksi, laporan, foto, dan catatan kasus.')],[t('Connect the clues','Hubungkan petunjuk'),t('Find contradictions and test competing explanations against the sources.','Temukan pertentangan dan uji berbagai penjelasan terhadap sumbernya.')],[t('Solve the case','Pecahkan kasus'),t('Reconstruct the events and support every part of your conclusion.','Rekonstruksi kejadian serta dukung setiap bagian kesimpulan kamu.')]].map(([h,p],i)=>`<article class="intro-item"><span>0${i+1}</span><div><strong>${h}</strong><p>${p}</p></div></article>`).join('')}</section>`}
function difficultyGuide(){return `<section class="difficulty-section"><div class="section-head"><h2>${t('Find your level of intrigue.','Temukan tantangan yang sesuai.')}</h2></div><div class="difficulty-grid">${[[t('Easy','Mudah'),t('Focused evidence and direct logical connections. A good place to begin.','Bukti terfokus dan hubungan logis langsung. Tempat yang tepat untuk memulai.')],[t('Medium','Sedang'),t('Connect multiple sources and evaluate competing explanations.','Hubungkan berbagai sumber dan nilai penjelasan yang bersaing.')],[t('Complicated','Rumit'),t('Reconstruct layered events through interconnected clues and hypotheses.','Rekonstruksi kejadian berlapis melalui petunjuk serta hipotesis yang saling terkait.')]].map(([h,p],i)=>`<article><small class="muted">0${i+1}</small><h3 style="margin-top:12px">${h}</h3><p>${p}</p></article>`).join('')}</div></section>`}
function howToPlay(){return `<section class="subpage"><div class="eyebrow">${t('FIELD GUIDE','PANDUAN LAPANGAN')}</div><h1>${t('A method for the curious.','Metode bagi pikiran ingin tahu.')}</h1><p>${t('Read carefully. Distinguish observations from interpretations. Let the sources change your theory.','Baca dengan saksama. Bedakan pengamatan dari penafsiran. Biarkan sumber mengubah teori kamu.')}</p>${gameplaySteps()}<div class="split"><div class="panel"><h3>${t('Your investigation desk','Meja investigasi kamu')}</h3><p>${t('Keep up to two active investigations. Completing or archiving a case frees a slot. Archiving preserves your evidence, notes and answers.','Jalankan maksimal dua investigasi aktif. Menyelesaikan atau mengarsipkan kasus membuka slot. Bukti, catatan, dan jawaban tetap tersimpan dalam arsip.')}</p><p>${t('Read every record, question the available witnesses, complete the deductions and review all four views of an unlocked instrument before continuing.','Baca setiap catatan, tanyai saksi yang tersedia, selesaikan deduksi, dan tinjau keempat tampilan instrumen yang terbuka sebelum melanjutkan.')}</p></div><div class="panel"><h3>${t('Return with your player ID','Kembali dengan ID pemain kamu')}</h3><p>${t('Choose five letters; DEDUCE assigns three different digits. Save the full ID to reopen your progress on another device. Anyone who has it can access that progress.','Pilih lima huruf; DEDUCE menetapkan tiga angka berbeda. Simpan ID lengkap untuk membuka progres melalui perangkat lain. Siapa pun yang memilikinya bisa mengakses progres itu.')}</p><p>${t('Cases 001–018 stand alone. The Hollow Network unfolds through six episodes in order. Scores depend on answers and hints, with no time penalty.','Kasus 001–018 berdiri sendiri. Hollow Network berkembang melalui enam episode berurutan. Skor bergantung pada jawaban dan petunjuk, tanpa penalti waktu.')}</p></div></div><div style="margin-top:48px">${difficultyGuide()}</div>${previewInvestigation()}</section>`}
function previewInvestigation(){const records=[[t('Witness statement','Keterangan saksi'),t('The sealed envelope','Amplop tersegel'),t('At 21:10, Leon says: “I carried the envelope through the east lobby without opening the seal.”','Pada 21.10, Leon berkata: “Saya membawa amplop melalui lobi timur tanpa membuka segelnya.”')],[t('Access record','Catatan akses'),t('The east lobby','Lobi timur'),t('The east lobby was closed for maintenance from 20:45 to 21:30. The door sensor records no opening during that interval.','Lobi timur ditutup untuk perawatan dari 20.45 hingga 21.30. Sensor pintu tidak mencatat pembukaan selama waktu itu.')],[t('Independent check','Pemeriksaan independen'),t('A clock reconciliation','Penyelarasan jam'),t('The interview timestamp and door sensor use the same verified building clock. The envelope’s contents have not been examined.','Waktu wawancara dan sensor pintu memakai jam gedung yang sama dan sudah diverifikasi. Isi amplop belum diperiksa.')]];return `<section class="preview-section" id="mini-case"><div class="section-head"><div><div class="eyebrow">${t('TRY A DEDUCTION · NO ACCOUNT NEEDED','COBA DEDUKSI · TANPA AKUN')}</div><h2>${t('The closed lobby.','Lobi yang tertutup.')}</h2></div><span class="tag">${t('QUICK INVESTIGATION','INVESTIGASI SINGKAT')}</span></div><p>${t('Three records. One claim to test. What can you establish?','Tiga catatan. Satu klaim untuk diuji. Apa yang bisa kamu pastikan?')}</p><div class="preview-grid">${records.map(([type,title,body],i)=>`<article class="preview-record"><small class="muted">P0${i+1} / ${type}</small><h3>${title}</h3><p>${body}</p></article>`).join('')}</div><section class="question"><h3>${t('Which part of Leon’s account conflicts with the records?','Bagian keterangan Leon mana yang bertentangan dengan catatan?')}</h3><div role="radiogroup" aria-label="${t('Preview deduction options','Opsi deduksi pratinjau')}">${[t('He used the east lobby at 21:10.','Ia memakai lobi timur pada 21.10.'),t('He opened the envelope’s seal.','Ia membuka segel amplop.'),t('The envelope contained stolen money.','Amplop itu berisi uang curian.'),t('He knew the maintenance supervisor.','Ia mengenal pengawas perawatan.')].map((o,i)=>`<button class="option ${previewChoice===i?'selected':''}" role="radio" tabindex="${(previewChoice??0)===i?0:-1}" aria-checked="${previewChoice===i}" data-preview="${i}"><b>${'ABCD'[i]}</b>${o}</button>`).join('')}</div><div class="qactions"><small class="muted">${t('Your main case progress is unaffected.','Progres kasus utama kamu tetap tersimpan.')}</small><button class="primary" data-action="preview-confirm" ${previewChoice===null?'disabled':''}>${t('Confirm deduction','Konfirmasi deduksi')}</button></div><div id="preview-feedback" role="status">${previewFeedback?`<div class="feedback ${previewFeedback==='correct'?'success':''}">${previewReasoning(previewChoice)}</div><button class="textbtn" data-start="1">${t('Continue into a full investigation','Lanjutkan ke investigasi lengkap')}</button>`:''}</div></section></section>`}
function previewReasoning(choice){return choice===0?t('The synchronized records place 21:10 inside the closure interval, with no door opening. That contradicts the route Leon described. It does not establish what was inside the envelope or whether he opened it.','Catatan dengan jam selaras menempatkan 21.10 dalam masa penutupan, tanpa pintu terbuka. Ini bertentangan dengan rute yang dijelaskan Leon. Bukti itu tidak memastikan isi amplop ataupun apakah ia membukanya.'):t('That claim is not established by these sources. Compare the claimed route and time against the door sensor and verified clock. Then revise your deduction.','Klaim itu belum dibuktikan oleh sumber ini. Bandingkan rute serta waktu yang disebutkan dengan sensor pintu dan jam terverifikasi. Lalu revisi deduksi kamu.')}
function evidenceType(e){const name=(e.title.en+' '+e.source.en).toLowerCase();return /interview|witness|statement|testimony/.test(name)?'testimony':/timeline|chronolog|time.?log|calendar/.test(name)?'timeline':/medical|forensic|laboratory|lab |autopsy|examination|eeg|dna/.test(name)?'forensic':/photo|camera|image|footage/.test(name)?'visual':'record'}
function typeLabel(type){return ({testimony:t('Statements','Keterangan'),timeline:t('Timelines & logs','Linimasa & log'),forensic:t('Examinations & reports','Pemeriksaan & laporan'),visual:t('Visual records','Catatan visual'),record:t('Documents & records','Dokumen & catatan')})[type]}
function archiveDocument(e,doc){const reviewed=current.attempt.inspected.includes(e.id);return `<button class="archive-doc ${doc?.id===e.id?'selected':''}" data-open-evidence="${e.id}" aria-pressed="${doc?.id===e.id}"><small>${e.id}${reviewed?' · ✓':''}</small><strong>${esc(tr(e.title))}</strong><span class="review-state">${reviewed?t('Reviewed','Ditinjau'):t('Open record','Buka catatan')}</span></button>`}
function markedEvidence(e){let text=esc(tr(e.body));for(const h of current.attempt.highlights||[])if(h.evidence===e.id&&tr(e.body).includes(h.quote))text=text.replace(esc(h.quote),'<mark>'+esc(h.quote)+'</mark>');return text}
function phaseSources(){const v=current,stage=v.attempt.stage,items=v.evidence.filter(e=>e.stage===stage);if(items.length)return items;const q=v.questions.find(q=>q.stage===stage&&!v.attempt.answers.includes(q.id))||v.questions.find(q=>q.stage===stage);return (q?.refs||[]).map(id=>v.evidence.find(e=>e.id===id)).filter(Boolean)}
function evidenceSpread(items){if(!items.length)return '';const a=current.attempt,unread=items.filter(e=>!a.inspected.includes(e.id));return `<section class="evidence-spread"><div class="viewer-toolbar"><div><small class="muted">${t('EVIDENCE FOR THIS PHASE','BUKTI UNTUK TAHAP INI')}</small><h3 style="margin:8px 0">${t('Read the records together.','Baca catatan ini bersama.')}</h3></div>${unread.length?`<button class="primary" data-review-phase>${items.length===2?t('Open both records','Buka kedua catatan'):t('Open these records','Buka catatan ini')}</button>`:`<span class="tag">✓ ${items.length} ${t('RECORDS REVIEWED','CATATAN DITINJAU')}</span>`}</div><div class="source-pair ${docZoom?'large-text':''}">${items.map(e=>{const seen=a.inspected.includes(e.id),pinned=a.pins.includes(e.id);return `<article class="paper source-record" data-type="${evidenceType(e)}" data-source-id="${e.id}"><small>${e.id} / ${esc(tr(e.source))}</small><div class="rule"></div><h3>${esc(tr(e.title))}</h3>${seen?`<p>${markedEvidence(e)}</p><div class="viewer-tools"><button class="outline" data-inline-pin="${e.id}" aria-pressed="${pinned}">${pinned?'✓ ':''}${pinned?t('Pinned','Disematkan'):t('Pin record','Sematkan catatan')}</button><button class="textbtn" data-highlight="${e.id}">${t('Highlight passage','Sorot bagian')}</button></div>`:`<p>${t('Open the records to read their contents together.','Buka catatan untuk membaca isinya bersama.')}</p><button class="primary" data-review-phase>${items.length===2?t('Open both records','Buka kedua catatan'):t('Open records','Buka catatan')}</button>`}</article>`}).join('')}</div></section>`}

function evidenceViewer(e){const seen=current.attempt.inspected.includes(e.id),pinned=current.attempt.pins.includes(e.id);return `<div class="viewer-toolbar"><small class="muted">${e.id} / ${typeLabel(evidenceType(e))}</small><div class="viewer-tools">${seen?`<button class="outline" data-inline-pin="${e.id}" aria-pressed="${pinned}">${pinned?'✓ ':''}${pinned?t('Pinned','Disematkan'):t('Pin record','Sematkan catatan')}</button><button class="outline" data-action="text-size" aria-pressed="${docZoom}">${t('Text size','Ukuran teks')} A</button>`:''}</div></div>${seen?`<article class="paper active-document ${docZoom?'large-text':''}" id="active-document" data-evidence-id="${e.id}" data-type="${evidenceType(e)}" tabindex="0" aria-label="${esc(tr(e.title))}"><small>${t('DEDUCE / EVIDENCE RECORD','DEDUCE / CATATAN BUKTI')} · ${caseNo(current.case.id)}<br>${e.id} · ${esc(tr(e.source))}</small><div class="rule"></div><h2>${esc(tr(e.title))}</h2><p>${markedEvidence(e)}</p><div class="stamp">${t('EXAMINED & RECORDED','DIPERIKSA & DICATAT')}</div></article><div class="viewer-tools"><button class="textbtn" data-highlight="${e.id}">${t('Highlight passage','Sorot bagian')}</button><button class="textbtn" data-action="compare">${t('Compare records','Bandingkan catatan')}</button></div>`:`<div class="panel source-closed"><small class="muted">${esc(tr(e.source))}</small><h3 style="margin-top:16px">${esc(tr(e.title))}</h3><p>${t('Open this record to examine its contents and add it to your reviewed evidence.','Buka catatan ini untuk memeriksa isinya serta menambahkannya ke bukti yang ditinjau.')}</p><button class="primary" data-open-evidence="${e.id}">${t('Examine record','Periksa catatan')}</button></div>`}`}
async function flushNotes(){clearTimeout(window.noteTimer);if(noteFlush){await noteFlush;if(notesDirty.size)return flushNotes();return}noteFlush=(async()=>{while(notesDirty.size){for(const [id,notes] of [...notesDirty]){await api('notes',{attempt:id,notes});if(notesDirty.get(id)===notes)notesDirty.delete(id)}}})();try{await noteFlush;if($('#saved'))$('#saved').textContent=t('Saved to your case file','Tersimpan di berkas kasus kamu')}finally{noteFlush=null}}

async function openEvidence(id){const el=$('#active-document');if(el&&viewerId)documentPositions.set(viewerId,el.scrollTop);if(!current)return;workspaceTab='evidence';if(current.attempt.status!=='COMPLETED'&&!current.attempt.inspected.includes(id)){const v=await perform('inspect',{evidence:id},false);if(!v)return}else{current.attempt.recentEvidence=[id,...(current.attempt.recentEvidence||[]).filter(x=>x!==id)].slice(0,8)}viewerId=id;localStorage.setItem('deduce-evidence-'+current.attempt.id,id);render();const next=$('#active-document');if(next){next.scrollTop=documentPositions.get(id)||0;if(window.matchMedia?.('(max-width:900px)')?.matches)next.scrollIntoView({block:'start'})}}
function compareSources(){const items=current.evidence.filter(e=>current.attempt.inspected.includes(e.id));if(items.length<2)return `<h2>${t('Compare two records','Bandingkan dua catatan')}</h2><p>${t('Review at least two evidence records to compare their contents.','Tinjau setidaknya dua catatan bukti untuk membandingkan isinya.')}</p>`;const chosen=modal.records||[items[0].id,items.at(-1).id];return `<h2>${t('Compare the sources.','Bandingkan sumbernya.')}</h2><div class="split">${chosen.map((id,i)=>{const e=items.find(e=>e.id===id)||items[i];return `<section><label class="field-label" for="compare-${i}">${t('Record','Catatan')} ${i+1}</label><select id="compare-${i}" class="field" data-compare-select="${i}">${items.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${x.id} / ${esc(tr(x.title))}</option>`).join('')}</select><article class="paper" data-type="${evidenceType(e)}"><small>${e.id} · ${esc(tr(e.source))}</small><h3>${esc(tr(e.title))}</h3><p>${esc(tr(e.body))}</p></article></section>`}).join('')}</div>`}
function updateMetadata(){const c=route.startsWith('case-')?profile.cases.find(c=>c.id===Number(route.slice(5))):null;document.title=c?'DEDUCE — '+tr(c.title):t('DEDUCE — Interactive Detective Cases and Deduction Games','DEDUCE — Kasus Detektif Interaktif dan Permainan Deduksi');const canonical=$('link[rel="canonical"]');if(canonical)canonical.href='https://www.deduce.my.id'+(c?'/cases/'+caseNo(c.id):'/');const desc=$('meta[name="description"]');if(desc)desc.content=c?tr(c.brief):t('Investigate original mysteries, examine evidence, challenge witness statements and solve interactive detective cases through logic and deduction.','Selidiki misteri orisinal, periksa bukti, uji keterangan saksi, dan pecahkan kasus detektif interaktif melalui logika serta deduksi.')}
function downloadCompletion(){const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=630;const x=canvas.getContext('2d');x.fillStyle='#11101d';x.fillRect(0,0,1200,630);x.strokeStyle='#956dc2';x.lineWidth=2;x.strokeRect(40,40,1120,550);x.textAlign='center';x.fillStyle='#c994d4';x.font='24px monospace';x.fillText('DEDUCE / '+t('CASE CLOSED','KASUS SELESAI')+' / '+caseNo(current.case.id),600,150);x.fillStyle='#f5f0fa';x.font='40px sans-serif';const title=tr(current.case.title),words=title.split(' ');let line='',lines=[];for(const word of words){if(x.measureText(line+' '+word).width>950){lines.push(line);line=word}else line+=(line?' ':'')+word}lines.push(line);lines.forEach((v,i)=>x.fillText(v,600,260+i*55));x.font='24px monospace';x.fillText(t('DEDUCTION SCORE','SKOR DEDUKSI')+' '+current.score+'/100',600,440);x.font='20px sans-serif';x.fillText('www.deduce.my.id',600,530);openModal('completion-card',{image:canvas.toDataURL()})}
function header(){const nav=[['home',t('Home','Beranda')],['cases',t('Case archive','Arsip kasus')],['how-to-play',t('How to play','Cara bermain')],['bureau',t('My investigations','Investigasi saya')]];const links=()=>nav.map(([r,label])=>`<a href="${routeURL(r)}" data-route="${r}" class="${route===r?'current':''}" ${route===r?'aria-current="page"':''}>${label}</a>`).join('');return `<a class="brand" href="/" data-route="home" aria-label="${t('DEDUCE home','Beranda DEDUCE')}"><span class="mark">${icon('search',22)}</span><strong>DEDUCE</strong></a><nav class="nav" aria-label="${t('Main navigation','Navigasi utama')}">${links()}</nav><div class="rightnav">${!profile.name?`<button class="textbtn" data-action="login">${t('Returning player?','Pemain lama?')}</button>`:`<a class="outline" href="/#profile" data-route="profile">${esc(profile.name)}</a>`}<div class="language" role="group" aria-label="${t('Language','Bahasa')}">${['en','id'].map(l=>`<button data-lang="${l}" class="${lang===l?'on':''}" aria-pressed="${lang===l}" aria-label="${l==='en'?'English':'Bahasa Indonesia'}">${l.toUpperCase()}</button>`).join('')}</div><button class="menu-toggle" data-action="menu" aria-expanded="${menuOpen}" aria-controls="mobile-menu" aria-label="${menuOpen?t('Close navigation','Tutup navigasi'):t('Open navigation','Buka navigasi')}">${menuOpen?'×':'☰'}</button></div><nav id="mobile-menu" class="mobile-menu ${menuOpen?'open':''}" aria-label="${t('Mobile navigation','Navigasi seluler')}" ${menuOpen?'':'hidden'}>${links()}<a href="/#network" data-route="network">${t('Network intelligence','Intelijen jaringan')}</a><button data-action="${profile.name?'settings':'login'}">${profile.name?t('Profile settings','Pengaturan profil'):t('Sign in with a player ID','Masuk dengan ID pemain')}</button></nav>`}

function hollowFolder(){const cs=profile.cases.filter(c=>c.series),done=cs.filter(c=>profile.attempts.some(a=>a.caseId===c.id&&a.status==='COMPLETED')).length;return `<section class="panel hollow-folder"><div class="eyebrow">DEDUCE. / ${t('SPECIAL INVESTIGATIONS','INVESTIGASI KHUSUS')}</div><span class="tag">${t('SERIALIZED INVESTIGATION · PLAY IN ORDER','INVESTIGASI BERSERI · MAINKAN BERURUTAN')}</span><${route==='hollow'?'h1':'h2'}>THE HOLLOW NETWORK</${route==='hollow'?'h1':'h2'}><p>${t('Every crime has a perpetrator. Every perpetrator has a connection.','Setiap kejahatan memiliki pelaku. Setiap pelaku memiliki hubungan.')}</p><div class="progress"><i style="width:${done/6*100}%"></i></div><div class="qactions"><button class="primary" data-route="hollow">${t('Open classified folder','Buka folder rahasia')}</button><button class="outline" data-route="network">${t('Intelligence board','Papan intelijen')} · ${done}/6</button></div></section>`}
function hollowPage(){return `<section class="subpage"><a class="back" href="/#cases" data-route="cases">${t('Case archive','Arsip kasus')}</a>${hollowFolder()}<div class="grid">${profile.cases.filter(c=>c.series).map(caseCard).join('')}</div></section>`}
function networkDiagram(n){const pos=[[90,75],[300,75],[510,75],[90,230],[300,230],[510,230]];return `<svg viewBox="0 0 600 310" role="img" aria-label="${t('Network divisions and verified connections','Divisi jaringan serta hubungan terverifikasi')}" style="width:100%;max-height:360px"><defs><radialGradient id="ng"><stop stop-color="#8d549940"/><stop offset="1" stop-color="#1f1a38"/></radialGradient></defs><rect width="600" height="310" rx="25" fill="url(#ng)"/>${n.questions.filter(q=>q.solved).map(q=>{const a=pos[q.edge[0]-19],b=pos[q.edge[1]-19];return `<path d="M${a} L${b}" stroke="#a882bc" stroke-width="2"/>`}).join('')}${n.declassified?[0,1,2,3,4].map(i=>`<path d="M${pos[i]} L${pos[5]}" stroke="#7a9bd5" stroke-width="2"/>`).join(''):''}${n.nodes.map((x,i)=>`<circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="27" fill="${x.unlocked?'#8d5499':'#29233f'}" stroke="#c8aad7" stroke-opacity="${x.unlocked?1:.3}"/><text x="${pos[i][0]}" y="${pos[i][1]+5}" text-anchor="middle" fill="#fbeef5" font-size="13">${caseNo(x.id)}</text><text x="${pos[i][0]}" y="${pos[i][1]+48}" text-anchor="middle" fill="#cbb5dc" font-size="10">${esc(tr(x.label))}</text>`).join('')}</svg>`}
function networkDomains(n){return [['pattern',t('Cross-case patterns','Pola lintas kasus')],['synthesis',t('Evidence synthesis','Sintesis bukti')],['hypothesis',t('Hypothesis evaluation','Evaluasi hipotesis')],['organization',t('Organizational reconstruction','Rekonstruksi organisasi')]].map(([key,label])=>{const j=n.journal.filter(x=>x.domain===key),right=new Set(j.filter(x=>x.correct).map(x=>x.question)).size,wrong=j.filter(x=>!x.correct).length;return `<div class="note-evidence"><span>${label}</span><strong>${Math.round(right/(3+wrong)*100)}%</strong></div>`}).join('')}

function networkPage(){const n=profile.network,open=n.nodes.filter(x=>x.unlocked);const status=x=>({UNVERIFIED:t('UNVERIFIED','BELUM DIVERIFIKASI'),SUSPECTED:t('SUSPECTED','DIDUGA'),VERIFIED:t('VERIFIED','TERVERIFIKASI'),DISPROVEN:t('DISPROVEN','TERBANTAH')})[x];return `<section class="subpage"><button class="back" data-route="hollow">THE HOLLOW NETWORK</button><div class="eyebrow">${t('CLASSIFIED INTELLIGENCE','INTELIJEN RAHASIA')}</div><h1>${t('The connections remain.','Hubungannya tetap ada.')}</h1><p>${t('Close an episode to unlock its node. Review its people, records and shared identifiers, then test the connections.','Selesaikan episode untuk membuka simpulnya. Tinjau tokoh, catatan, serta penanda bersama, lalu uji hubungannya.')}</p><div class="panel"><div class="section-head"><h3>${t('Network Intelligence Board','Papan Intelijen Jaringan')}</h3><span class="tag">${open.length}/6</span></div>${networkDiagram(n)}<div class="network-nodes">${n.nodes.map(x=>`<button class="panel network-node ${x.unlocked?'unlocked':''}" data-network-node="${x.id}" ${x.unlocked?'':'disabled'}><small>${caseNo(x.id)} / ${x.unlocked?(n.reviewed.includes(x.id)?t('REVIEWED','DITINJAU'):t('NEW INTELLIGENCE','INTELIJEN BARU')):t('CLASSIFIED','RAHASIA')}</small><h3>${esc(tr(x.label))}</h3>${x.unlocked?`<span class="tag">${esc(x.code)}</span><p>${esc(tr(x.component))}</p>`:`<p>${t('Complete this episode to reveal its connections.','Selesaikan episode ini untuk mengungkap hubungannya.')}</p>`}</button>`).join('')}</div><div class="network-edges">${n.questions.filter(q=>q.solved).map(q=>`<div class="linked">${q.edge.map(caseNo).join(' · ')} <span class="tag">${status('VERIFIED')}</span><p>${esc(tr(q.explanation))}</p></div>`).join('')}</div><small>${t('Finale preparation','Persiapan final')}: ${n.reviewed.filter(id=>id<24).length}/5 ${t('nodes reviewed','simpul ditinjau')} · ${n.verified.length}/4 ${t('connections established','hubungan dibuktikan')}</small></div>${n.questions.map(q=>`<section class="question"><small>${q.id} · ${q.refs.join(' · ')} ${q.solved?'✓':''}</small><h3>${esc(tr(q.prompt))}</h3><div role="radiogroup" aria-label="${esc(tr(q.prompt))}">${q.options.map((o,i)=>`<button class="option ${selected[q.id]===i?'selected':''}" data-net-q="${q.id}" data-option="${i}" aria-pressed="${selected[q.id]===i}"><b>${'ABCD'[i]}</b>${esc(tr(o))}</button>`).join('')}</div><button class="primary" data-net-submit="${q.id}" ${selected[q.id]===undefined?'disabled':''}>${q.solved?t('Revise theory','Revisi teori'):t('Test connection','Uji hubungan')}</button>${q.solved?`<p>${esc(tr(q.explanation))}</p>`:''}</section>`).join('')}${open.length>1?`<section class="panel"><h3>${t('Your connection hypotheses','Hipotesis hubungan kamu')}</h3><p>${t('These ratings record your assessment. Source-supported connections above are verified through deduction challenges.','Penilaian ini mencatat pendapat kamu. Hubungan berbukti di atas diverifikasi melalui tantangan deduksi.')}</p><form id="network-form"><div class="split">${[0,1].map(i=>`<select class="field" id="network-${i}" aria-label="${t('Node','Simpul')} ${i+1}">${open.map((x,j)=>`<option value="${x.id}" ${j===i?'selected':''}>${caseNo(x.id)} / ${esc(tr(x.label))}</option>`).join('')}</select>`).join('')}</div><select class="field" id="network-status">${['UNVERIFIED','SUSPECTED','VERIFIED','DISPROVEN'].map(x=>`<option value="${x}">${status(x)}</option>`).join('')}</select><button class="outline">${t('Record hypothesis','Catat hipotesis')}</button></form>${n.hypotheses.map(h=>`<div class="linked">${caseNo(h.from)} · ${caseNo(h.to)} <span class="tag">${status(h.status)}</span></div>`).join('')}</section>`:''}${n.declassified?`<section class="panel"><div class="eyebrow">${t('NETWORK DECLASSIFICATION REPORT','LAPORAN DEKLASIFIKASI JARINGAN')}</div><h2>${n.score}/100</h2><h3>${t('Network Deduction Score','Skor Deduksi Jaringan')}</h3><p>${n.correct}/${n.required} ${t('structural deductions established','deduksi struktural dibuktikan')} · ${n.errors} ${t('revisions','revisi')}</p>${networkDomains(n)}<p>${esc(tr(n.nodes.find(x=>x.id===24).summary))}</p><div class="comparison-records">${open.map(x=>`<article><small>${caseNo(x.id)} · ${x.code}</small><h3>${esc(tr(x.label))}</h3><p>${esc(tr(x.summary))}</p><p>${esc(x.people.join(' · '))}</p></article>`).join('')}</div></section>`:''}<section class="panel"><h3>${t('Network Theory Journal','Jurnal Teori Jaringan')}</h3><p>${t('Your original answers and later revisions remain in sequence.','Jawaban awal serta revisi berikutnya tetap tersimpan berurutan.')}</p>${n.journal.map(j=>`<article class="linked"><small>${esc(j.question)} · ${j.correct?'✓':t('REVISED','DIREVISI')}</small><p>${esc(tr(j.prompt))}</p><strong>${esc(tr(j.selected))}</strong><p>${j.refs.join(' · ')}</p></article>`).join('')||`<p>${t('The first connection is still waiting.','Hubungan pertama masih menunggu.')}</p>`}</section></section>`}

function cards(){const cs=filteredCases();return [1,2,3].filter(vol=>cs.some(c=>c.volume===vol)).map(vol=>`<section class="volume-section"><div class="volume-heading"><div><small class="muted">VOLUME ${roman(vol)}</small><h2>${volumeName(vol)}</h2></div><span class="tag">${cs.filter(c=>c.volume===vol).length} ${t('CASES','KASUS')}</span></div><div class="grid">${cs.filter(c=>c.volume===vol).map(caseCard).join('')}</div></section>`).join('')+(cs.some(c=>c.series)?hollowFolder()+((selectedFilter>=0||caseSearch)?`<div class="grid">${cs.filter(c=>c.series).map(caseCard).join('')}</div>`:''):'')+(!cs.length?`<div class="empty"><h3>${t('No matching case files.','Tidak ada berkas yang cocok.')}</h3><p>${t('Try another title, discipline or difficulty.','Coba judul, bidang, atau tingkat kesulitan lain.')}</p><button class="outline" data-action="reset-filters">${t('Reset filters','Atur ulang filter')}</button></div>`:'')}
function filters(){return `<label class="field-label" for="case-search">${t('Search the archive','Cari dalam arsip')}</label><input class="field catalogue-search" id="case-search" type="search" value="${esc(caseSearch)}" placeholder="${t('Case title or investigative discipline','Judul kasus atau bidang investigasi')}"><div class="volume-tabs" role="group" aria-label="${t('Edition','Edisi')}">${[0,1,2,3,4].map(n=>`<button class="filter ${selectedVolume===n?'on':''}" aria-pressed="${selectedVolume===n}" data-volume="${n}">${n===0?t('All editions','Semua edisi'):n===4?t('Special edition','Edisi khusus'):'Volume '+roman(n)}</button>`).join('')}</div><div class="filters" role="group" aria-label="${t('Difficulty','Tingkat kesulitan')}">${[-1,0,1,2].map((n,i)=>`<button class="filter ${selectedFilter===n?'on':''}" aria-pressed="${selectedFilter===n}" data-filter="${n}">${[t('All difficulties','Semua tingkat'),t('Easy','Mudah'),t('Medium','Sedang'),t('Complicated','Rumit')][i]}</button>`).join('')}</div>`}
function home(){const recommended=profile.attempts.find(a=>a.status==='ACTIVE'),c=profile.cases.find(c=>c.id===(recommended?.caseId||1));return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${t('DEDUCE / CASE ARCHIVE 001–024','DEDUCE / ARSIP KASUS 001–024')}</div><h1>${t('Every detail.<br>Every doubt.<br><em>Every deduction.</em>','Setiap detail.<br>Setiap keraguan.<br><em>Setiap deduksi.</em>')}</h1><p>${t('Examine evidence, challenge testimonies, and connect the clues across 24 original investigations. Uncover the truth through your own reasoning.','Periksa bukti, uji keterangan saksi, dan hubungkan petunjuk dalam 24 investigasi orisinal. Ungkap kebenaran melalui penalaran kamu sendiri.')}</p><div class="hero-actions"><button class="primary" data-start="${c.id}">${recommended?t('Resume investigation','Lanjutkan investigasi'):t('Start investigating','Mulai menyelidiki')}</button><a class="outline" href="/#cases" data-route="cases">${t('Explore cases','Jelajahi kasus')}</a></div><div class="tinyline">${t('EN / ID · YOUR REASONING. YOUR STORY.','EN / ID · NALAR KAMU. CERITA KAMU.')}</div></div><div class="hero-art">${office()}<div class="art-caption">${t('EXAMINE. QUESTION. RECONSTRUCT.','PERIKSA. PERTANYAKAN. REKONSTRUKSI.')}</div></div></section>${gameplaySteps()}<section class="featured-case"><div class="case-art">${art(c.id)}<span class="case-num">${t('CASE','KASUS')} ${caseNo(c.id)}</span></div><div><div class="eyebrow">${recommended?t('Return to your desk','Kembali ke meja investigasi'):t('Your first investigation','Investigasi pertama kamu')}</div><h2>${esc(tr(c.title))}</h2><p>${esc(tr(c.brief))}</p><button class="primary" data-start="${c.id}">${recommended?t('Resume case','Lanjutkan kasus'):t('Open case file','Buka berkas kasus')}</button></div></section><section class="catalogue home-collection" id="case-catalogue"><div class="section-head"><div><div class="eyebrow">${t('Begin with the originals','Mulai dari kisah awal')}</div><h2>${t('The Case Collection','Koleksi Kasus')}</h2></div><a class="textbtn" href="/#cases" data-route="cases">${t('Browse all 24 cases','Jelajahi seluruh 24 kasus')}</a></div><div class="grid">${profile.cases.filter(c=>c.id<=6).map(caseCard).join('')}</div></section>${previewInvestigation()}${difficultyGuide()}<section class="final-cta"><div class="eyebrow" style="justify-content:center">${t('The next conclusion is yours','Kesimpulan berikutnya milik kamu')}</div><h2>${t('Follow the evidence.','Ikuti buktinya.')}</h2><p>${t('Every mystery leaves a trail of evidence waiting for a mind sharp enough to uncover the truth.','Setiap misteri meninggalkan jejak bukti, menanti pikiran yang cukup tajam untuk mengungkap kebenaran.')}</p><button class="primary" data-start="${c.id}">${t('Start investigating','Mulai menyelidiki')}</button></section>`}
function stats(){const done=profile.attempts.filter(a=>a.status==='COMPLETED'),subs=profile.attempts.reduce((n,a)=>n+a.submissions,0),right=profile.attempts.reduce((n,a)=>n+a.answers.length,0);return `<div class="statrow">${[[new Set(done.map(a=>a.caseId)).size+'/'+profile.cases.length,t('Cases closed','Kasus selesai')],[profile.attempts.filter(a=>a.status==='ACTIVE').length+'/2',t('Active investigations','Investigasi aktif')],[subs?Math.round(right/subs*100)+'%':'—',t('Deduction accuracy','Akurasi deduksi')],[profile.attempts.reduce((n,a)=>n+a.inspected.length,0),t('Evidence examined','Bukti diperiksa')]].map(([v,k])=>`<div class="stat"><strong>${v}</strong><span>${k}</span></div>`).join('')}</div>`}

function playRadio(panel){stopRadio();radioContext??=new (window.AudioContext||window.webkitAudioContext)();radioContext.resume();const start=radioContext.currentTime;const pattern=panel===3?[210,235,210]:[440,550,660];pattern.forEach((f,i)=>{const o=radioContext.createOscillator(),g=radioContext.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,start+i*.4);g.gain.linearRampToValueAtTime(.035,start+i*.4+.04);g.gain.linearRampToValueAtTime(0,start+i*.4+.3);o.connect(g);g.connect(radioContext.destination);o.start(start+i*.4);o.stop(start+i*.4+.32);radioNodes.push(o)});toast(t('Playing the recorded comparison sample.','Memutar sampel pembanding terekam.'))}

function workspace(){const v=current,a=v.attempt,c=v.case,final=a.stage>=v.scenes.length,scene=final?t('Final reconstruction','Rekonstruksi akhir'):tr(v.scenes[a.stage]);const ev=v.evidence.filter(e=>e.stage===a.stage),chars=v.characters.filter(ch=>ch.stage===a.stage),qs=v.questions.filter(q=>q.stage===a.stage),right=qs.filter(q=>a.answers.includes(q.id)).length;const desired=viewerId||localStorage.getItem('deduce-evidence-'+a.id),doc=v.evidence.find(e=>e.id===desired)||ev[0]||v.evidence.at(-1);if(doc)viewerId=doc.id;const groups=[...new Set(v.evidence.map(e=>evidenceType(e)))];return `<section class="subpage investigation"><a class="back" href="/#bureau" data-route="bureau">${t('My investigations','Investigasi saya')}</a><div class="section-head"><div><div class="eyebrow">${t('CASE','KASUS')} ${caseNo(c.id)} / ${t('DETECTIVE','DETEKTIF')} ${esc(profile.name)}</div><h1>${esc(tr(c.title))}</h1><p class="card-phase">${t('Phase','Tahap')} ${a.stage+1}/${v.scenes.length+1} · ${esc(scene)}</p></div><button class="outline" data-action="board">${t('Evidence board','Papan bukti')} · ${a.pins.length}</button></div><div class="progress" role="progressbar" aria-label="${t('Case progress','Progres kasus')}" aria-valuenow="${a.stage}" aria-valuemin="0" aria-valuemax="${v.scenes.length+1}"><i style="width:${a.stage/(v.scenes.length+1)*100}%"></i></div><details class="phase-map"><summary>${t('Investigation path','Alur investigasi')} · ${t('Current phase','Tahap saat ini')}: ${esc(scene)}</summary><ol class="stage-list">${[...v.scenes,{en:'Final reconstruction',id:'Rekonstruksi akhir'}].map((s,i)=>`<li><button disabled class="${i===a.stage?'on':i<a.stage?'done':''}" ${i===a.stage?'aria-current="step"':''}><b>${i<a.stage?'✓':String(i+1).padStart(2,'0')}</b><span>${esc(tr(s))} · ${i<a.stage?t('Complete','Selesai'):i===a.stage?t('Current','Saat ini'):t('Locked','Terkunci')}</span></button></li>`).join('')}</ol></details><div class="workspace-tabs" role="tablist" aria-label="${t('Workspace views','Tampilan investigasi')}">${[['evidence',t('Evidence','Bukti')],['notebook',t('Notebook','Catatan')],['deduction',t('Deduction','Deduksi')]].map(([key,label])=>`<button role="tab" id="tab-${key}" aria-controls="view-${key}" aria-selected="${workspaceTab===key}" tabindex="${workspaceTab===key?0:-1}" data-workspace-tab="${key}">${label}</button>`).join('')}</div><div class="workspace" data-workspace-tab="${workspaceTab}"><aside class="evidence-archive" aria-label="${t('Evidence archive','Arsip bukti')}"><h3>${t('Evidence archive','Arsip bukti')}</h3><small class="muted">${a.inspected.length}/${c.evidenceCount} ${t('reviewed','ditinjau')}</small>${(a.recentEvidence||[]).length?`<div class="evidence-group"><small>${t('Recently viewed','Baru dilihat')}</small><div class="evidence-list">${a.recentEvidence.slice(0,3).map(id=>v.evidence.find(e=>e.id===id)).filter(Boolean).map(e=>archiveDocument(e,doc)).join('')}</div></div>`:''}<details class="archive-folder" ${(archiveExpanded??!window.matchMedia?.('(max-width:900px)')?.matches)?'open':''}><summary>${t('Browse available records','Jelajahi catatan tersedia')} (${v.evidence.length})</summary>${groups.map(group=>`<div class="evidence-group"><small>${typeLabel(group)}</small><div class="evidence-list">${v.evidence.filter(e=>evidenceType(e)===group).map(e=>archiveDocument(e,doc)).join('')}</div></div>`).join('')}</details><button class="textbtn" data-action="compare">${t('Compare two records','Bandingkan dua catatan')}</button>${c.series?`<a class="textbtn" href="/#network" data-route="network">${t('Network intelligence','Intelijen jaringan')}</a>`:''}</aside><div class="scene-main"><section class="evidence-section" id="view-evidence" aria-labelledby="tab-evidence"><div class="scene-header"><div><small class="muted">${t('CURRENT LOCATION','LOKASI SAAT INI')}</small><h2>${esc(scene)}</h2></div><span class="tag">${t('PHASE','TAHAP')} ${a.stage+1}</span></div>${doc?(doc.stage===a.stage?evidenceSpread(ev):evidenceViewer(doc)):`<div class="panel"><p>${t('All source records are in the archive.','Semua catatan sumber tersedia dalam arsip.')}</p></div>`}${!final?`<details><summary>${t('Explore the scene','Jelajahi lokasi')} · ${ev.length} ${t('records','catatan')}</summary><div class="scene-art">${art(c.id)}${ev.map((e,i)=>`<button class="hotspot ${a.inspected.includes(e.id)?'seen':''}" style="left:${15+i*28}%;top:${35+i*12}%" data-open-evidence="${e.id}" aria-label="${esc(t('Inspect ','Periksa ')+tr(e.title))}">${i+1}</button>`).join('')}</div></details>${chars.length?`<div class="panel" style="margin-top:24px"><h3>${t('People & testimony','Tokoh & keterangan')}</h3>${chars.map(ch=>`<div class="person"><div class="portrait">${portrait(v.characters.indexOf(ch)+c.id)}</div><div><strong>${esc(ch.name)}</strong><p>${ch.age} · ${esc(tr(ch.role))}</p><button data-interview="${ch.id}">${ch.transcript.length?'✓ ':''}${t('Review testimony','Tinjau keterangan')}</button></div></div>`).join('')}</div>`:''}`:''}${caseTool()}<div class="qactions"><button class="primary" data-workspace-tab="deduction">${t('Review deductions','Tinjau deduksi')} · ${right}/${qs.length}</button></div></section><section class="deduction-section" id="view-deduction" aria-labelledby="tab-deduction"><div class="deduction-sources">${evidenceSpread(phaseSources())}</div><div class="section-head" style="margin-top:24px"><div><small class="muted">${t('EVIDENCE INTO UNDERSTANDING','DARI BUKTI MENJADI PEMAHAMAN')}</small><h3>${final?t('Your final reconstruction','Rekonstruksi akhir kamu'):t('Test your deductions','Uji deduksi kamu')}</h3></div><button class="textbtn" data-workspace-tab="evidence">${t('Review evidence','Tinjau bukti')}</button></div>${qs.map(question).join('')}${!final?`<div class="qactions"><small class="muted">${right}/${qs.length} ${t('CHECKPOINTS COMPLETE','DEDUKSI SELESAI')}</small><button class="primary" data-action="advance">${a.stage===v.scenes.length-1?t('Build final theory','Susun teori akhir'):t('Continue investigation','Lanjutkan investigasi')}</button></div>`:''}</section></div><aside class="workspace-notes" id="view-notebook" aria-labelledby="tab-notebook"><div class="panel notebook"><div class="notebook-main"><small class="muted">${t('DETECTIVE NOTEBOOK','BUKU CATATAN DETEKTIF')}</small><h3 style="margin-top:12px">${t('Keep a clear head.','Jaga kejernihan pikiran.')}</h3><p>${t('Separate what the records establish from what you suspect.','Pisahkan fakta dalam catatan dari dugaan kamu.')}</p><label class="field-label" for="notes">${t('Your investigation notes','Catatan investigasi kamu')}</label><textarea id="notes" class="field" maxlength="12000" placeholder="${t('Facts, contradictions, open questions…','Fakta, kontradiksi, pertanyaan…')}">${esc(notesDirty.get(a.id)??a.notes)}</textarea><small id="saved" role="status">${t('Saved automatically','Tersimpan otomatis')}</small></div><div><div class="note-evidence"><span>${t('Pinned records','Catatan disematkan')}</span><span>${a.pins.length}</span></div>${a.pins.map(id=>`<button class="textbtn" style="display:block" data-open-evidence="${id}">${id}</button>`).join('')||`<p>${t('Pin a useful source from the evidence viewer.','Sematkan sumber berguna melalui penampil bukti.')}</p>`}<h4 style="margin-top:24px">${t('Highlighted passages','Bagian yang disorot')}</h4>${(a.highlights||[]).map((h,i)=>`<div class="highlight-item"><small>${h.evidence}</small><p>“${esc(h.quote)}”</p><button data-remove-highlight="${i}">${t('Remove highlight','Hapus sorotan')}</button></div>`).join('')||`<p>${t('Select a passage in a reviewed record, then choose Highlight passage.','Pilih bagian dalam catatan yang ditinjau, lalu pilih Sorot bagian.')}</p>`}</div></div></aside></div></section>`}
function question(q){const done=current.attempt.answers.includes(q.id);if(current.case.id===24&&q.stage===current.scenes.length&&!done){const first=current.questions.find(x=>x.stage===q.stage&&!current.attempt.answers.includes(x.id));if(first&&first.id!==q.id)return ''}return `<section class="question" id="${q.id}"><small class="muted">${done?'✓ ':''}${t('DEDUCTION','DEDUKSI')} / ${q.id} · ${q.refs.join(', ')}</small><h3>${esc(tr(q.prompt))}</h3>${done?`<div class="feedback success">${esc(tr(q.explanation))}</div>`:`<div role="radiogroup" aria-label="${esc(tr(q.prompt))}">${q.options.map((o,i)=>`<button class="option ${selected[q.id]===i?'selected':''}" data-question="${q.id}" data-option="${i}" role="radio" tabindex="${(selected[q.id]??0)===i?0:-1}" aria-checked="${selected[q.id]===i}" aria-pressed="${selected[q.id]===i}"><b>${'ABCD'[i]}</b>${esc(tr(o))}</button>`).join('')}</div><div class="qactions"><button class="textbtn" data-hint="${q.id}">${t('Request a hint','Minta petunjuk')} <small>−4</small></button><button class="primary" ${selected[q.id]===undefined?'disabled':''} data-submit="${q.id}">${t('Confirm deduction','Konfirmasi deduksi')} </button></div>${q.usedHints.map(h=>`<div class="feedback">${esc(tr(h))}</div>`).join('')}`}</section>`}

function accountCard(){return `<section class="panel" style="margin:24px 0"><div class="eyebrow">${t('YOUR PLAYER ACCOUNT','AKUN PEMAIN KAMU')}</div>${profile.username?`<h3 style="font:32px monospace;letter-spacing:4px;margin:18px 0">${esc(profile.username)}</h3><p>${t('Save this ID to return on any device. Anyone with it can open your progress.','Simpan ID ini untuk kembali dari perangkat mana pun. Siapa pun yang memilikinya bisa membuka progres kamu.')}</p><div class="qactions"><button class="outline" data-action="download-id">${t('Save player ID','Simpan ID pemain')}</button><button class="textbtn" data-action="login">${t('Use another account','Gunakan akun lain')}</button><button class="textbtn" data-action="logout">${t('Sign out','Keluar')}</button></div>`:`<h3>${t('Take your progress with you.','Bawa progres kamu ke mana saja.')}</h3><p>${t('Choose five letters. We will assign three digits and keep all your current investigations.','Pilih lima huruf. Kami akan menetapkan tiga angka serta menyimpan semua investigasi kamu saat ini.')}</p><form id="claim-form"><label class="field-label" for="claim-prefix">${t('Your five letters','Lima huruf kamu')}</label><input class="field player-prefix" id="claim-prefix" required minlength="5" maxlength="5" pattern="[A-Za-z]{5}" placeholder="PEARL" autocomplete="off"><button class="primary">${t('Create my player ID','Buat ID pemain saya')}</button></form>`}</section>`}

function profilePage(){const done=profile.attempts.filter(a=>a.status==='COMPLETED'),n=new Set(done.map(a=>a.caseId)).size;return `<section class="subpage"><div class="section-head"><div><div class="eyebrow">${t('Investigator record','Catatan detektif')}</div><h1>${t('Detective','Detektif')} ${esc(profile.name)}</h1><p style="margin-top:15px">${rank(n)}</p></div><button class="outline" data-action="settings">${t('Edit profile & settings','Ubah profil & pengaturan')}</button></div>${accountCard()}${stats()}<div class="split"><div class="panel"><h3>${t('Achievements','Pencapaian')}</h3>${[[n>0,t('First case closed','Kasus pertama selesai')],[n>=3,t('Patterns in the noise','Pola di antara kekacauan')],[n>=6,t('Master of deduction','Ahli deduksi')],[new Set(done.filter(a=>a.caseId>=7&&a.caseId<=12).map(a=>a.caseId)).size===6,t('The Anatomy of Truth','Anatomi Kebenaran')],[new Set(done.filter(a=>a.caseId>=13&&a.caseId<=18).map(a=>a.caseId)).size===6,t('The Unseen Patterns','Pola yang Tak Terlihat')],[done.some(a=>a.hints.length===0),t('An independent mind','Pikiran mandiri')],[done.some(a=>a.errors===0),t('A precise conclusion','Kesimpulan akurat')]].map(([on,label])=>`<div class="note-evidence"><span>${on?'◆':'◇'} ${label}</span><span>${on?'✓':t('Locked','Terkunci')}</span></div>`).join('')}</div><div class="panel"><h3>${t('Investigation history','Riwayat investigasi')}</h3>${done.length?done.map(a=>`<button class="note-evidence" style="width:100%;text-align:left" data-attempt="${a.id}"><span>${esc(tr(profile.cases.find(c=>c.id===a.caseId).title))}<br><small>${new Date(a.completed).toLocaleDateString(lang==='id'?'id-ID':'en-GB')}</small></span><span>${Math.max(0,100-a.errors*3-a.hints.length*4)}/100 </span></button>`).join(''):`<p>${t('Your first closed case will appear here.','Kasus pertama yang kamu selesaikan akan muncul di sini.')}</p>`}<p>${t('Hints used','Petunjuk dipakai')}: ${profile.attempts.reduce((n,a)=>n+a.hints.length,0)}</p>${[1,2,3].map(vol=>`<button class="outline" style="margin:6px 4px 0 0" data-certificate="${vol}" ${new Set(done.filter(a=>a.caseId>=(vol-1)*6+1&&a.caseId<=vol*6).map(a=>a.caseId)).size<6?'disabled':''}>${t('Download certificate','Unduh sertifikat')} · Volume ${roman(vol)}</button>`).join('')}</div></div></section>`}
function report(){const v=current,a=v.attempt;return `<section class="subpage report"><button class="back" data-route="bureau"> ${t('Return to bureau','Kembali ke biro')}</button><div class="seal">${t('CASE<br>CLOSED','KASUS<br>SELESAI')}</div><h1>${esc(tr(v.case.title))}</h1><p style="text-align:center">${t('Excellent work, Detective','Kerja bagus, Detektif')} ${esc(profile.name)}.</p><div class="statrow">${[[v.score+'/100',t('Case score','Skor kasus')],[a.submissions?Math.round(a.answers.length/a.submissions*100)+'%':'100%',t('Accuracy','Akurasi')],[a.inspected.length,t('Evidence examined','Bukti diperiksa')],[a.hints.length,t('Hints used','Petunjuk dipakai')]].map(([x,l])=>`<div class="stat"><strong>${x}</strong><span>${l}</span></div>`).join('')}</div><div class="panel"><div class="eyebrow">${t('What really happened','Yang sebenarnya terjadi')}</div><p class="solution">${esc(tr(v.resolution))}</p>${caseTool()}<div class="feedback">${t('Scoring: start at 100. Each incorrect submission costs 3 points; each new hint costs 4. Repeated views of the same hint are free. No time penalty.','Penilaian: mulai dari 100. Setiap jawaban salah mengurangi 3 poin; setiap petunjuk baru mengurangi 4. Melihat ulang petunjuk yang sama gratis. Tanpa penalti waktu.')}</div></div>${v.case.series?`<div class="qactions"><button class="primary" data-route="network">${t('Open Network Intelligence Board','Buka Papan Intelijen Jaringan')}</button>${v.case.id<24?`<button class="outline" data-case="${v.case.id+1}">${t('Next episode','Episode berikutnya')}</button>`:''}</div>`:''}<details class="completion-deductions"><summary>${t('Review the decisive deductions','Tinjau deduksi penentu')}</summary>${v.questions.filter(q=>q.stage===v.scenes.length).map(q=>`<article><h3>${esc(tr(q.prompt))}</h3><p>${esc(tr(q.explanation))}</p><small class="muted">${q.refs.join(' · ')}</small></article>`).join('')}</details><button class="outline" data-action="completion-card">${t('Save a spoiler-free completion card','Simpan kartu penyelesaian tanpa bocoran')}</button><div class="qactions"><button class="outline" data-action="all-evidence">${t('Review the evidence','Tinjau bukti')}</button><button class="primary" data-route="bureau">${t('Back to the bureau','Kembali ke biro')} </button></div></section>`}
function render(){if(!profile)return;const oldDoc=$('#active-document');if(oldDoc)documentPositions.set(oldDoc.dataset.evidenceId,oldDoc.scrollTop);document.documentElement.lang=lang;updateMetadata();$('#header').innerHTML=header();$('#footer').innerHTML=`<span>© 2026 DEDUCE. All Rights Reserved</span><div><button data-action="sound">${sound?'♫':'♪'} ${t('AMBIENCE','SUASANA')} ${sound?t('ON','AKTIF'):t('OFF','NONAKTIF')}</button> &nbsp; <button data-action="settings">${t('SETTINGS','PENGATURAN')}</button></div>`;if(route==='home')$('#app').innerHTML=home();else if(route==='how-to-play')$('#app').innerHTML=howToPlay();else if(route==='cases')$('#app').innerHTML=`<section class="subpage"><div class="eyebrow">${t('THE CASE COLLECTION','KOLEKSI KASUS')}</div><h1>${t('Choose your next mystery.','Pilih misteri kamu berikutnya.')}</h1>${filters()}<div id="catalogue-results">${cards()}</div></section>`;else if(route.startsWith('case-'))$('#app').innerHTML=detail(Number(route.split('-')[1]));else if(route==='workspace'&&current)$('#app').innerHTML=current.attempt.status==='COMPLETED'?report():workspace();else if(route==='hollow')$('#app').innerHTML=hollowPage();else if(route==='network'&&profile.name)$('#app').innerHTML=networkPage();else if(route==='profile'&&profile.name)$('#app').innerHTML=profilePage();else if(route==='bureau'&&profile.name)$('#app').innerHTML=bureau();else{route='home';$('#app').innerHTML=home()}bind();const newDoc=$('#active-document');if(newDoc)newDoc.scrollTop=documentPositions.get(newDoc.dataset.evidenceId)||0;if(modal)renderModal();motionObserver?.disconnect();const graphic=$('.hero-art');if(graphic)motionObserver?.observe(graphic)}
function openModal(type,data={}){if(!modal)lastFocus=document.activeElement;document.body.style.overflow='hidden';modal={type,...data};renderModal();setTimeout(()=>$('#overlay input, #overlay button:not(.close), #overlay textarea')?.focus(),50)}function closeModal(){document.body.style.overflow='';modal=null;$('#overlay').innerHTML='';lastFocus?.focus?.()}
function interviewQuestions(){return [t('What do you remember?','Apa yang kamu ingat?'),t('Which detail can be verified?','Detail mana yang bisa diverifikasi?'),t('How reliable is this account?','Seberapa dapat diandalkan keterangan ini?'),t('What should we check against it?','Apa yang perlu dibandingkan dengan keterangan ini?')]}
function renderModal(){if(!modal)return;let body='',wide=false;const m=modal;if(m.type==='onboard'||m.type==='settings'){const setup=m.type==='onboard';body=`<div class="eyebrow">${t('INVESTIGATOR REGISTRATION','PENDAFTARAN DETEKTIF')}</div><h2>${setup?t('Identify yourself, investigator.','Perkenalkan diri kamu, Detektif.'):t('Your investigator identity','Identitas detektif kamu')}</h2><p>${t('Every investigation needs a name on the case file. Enter yours to begin.','Setiap investigasi memerlukan nama dalam berkas kasus. Masukkan nama kamu untuk memulai.')}</p>${setup?`<button class="textbtn" data-action="login">${t('Already have a player ID? Sign in','Sudah punya ID pemain? Masuk')}</button>`:''}<form id="profile-form">${!profile.username?`<label class="field-label" for="player-prefix">${t('Choose your five letters','Pilih lima huruf kamu')}</label><div class="split"><input id="player-prefix" class="field player-prefix" minlength="5" maxlength="5" pattern="[A-Za-z]{5}" required placeholder="PEARL" autocomplete="off"><div class="field" aria-hidden="true">+ 000–999</div></div><p class="hinttext">${t('Letters are yours. Three digits are assigned automatically to keep every ID unique.','Huruf pilihan kamu. Tiga angka ditetapkan otomatis agar setiap ID unik.')}</p>`:''}<label class="field-label" for="alias">${t('Your name or detective alias','Nama atau alias detektif kamu')}</label><input id="alias" class="field" minlength="2" maxlength="30" required value="${esc(profile.name)}" placeholder="e.g. Morgan" autocomplete="nickname"><label class="field-label">${t('Choose your approach','Pilih gaya kamu')}</label><div class="avatars">${[t('Analyst','Analis'),t('Observer','Pengamat'),t('Strategist','Ahli strategi'),t('Scientist','Ilmuwan'),t('Profiler','Ahli profil'),t('Investigator','Penyelidik')].map((x,i)=>`<button type="button" class="avatarbtn ${avatar===i?'selected':''}" data-avatar="${i}">${portrait(i)}<span>${x}</span></button>`).join('')}</div><label class="field-label" for="pref-language">${t('Preferred language','Bahasa pilihan')}</label><select id="pref-language" class="field"><option value="en" ${lang==='en'?'selected':''}>English</option><option value="id" ${lang==='id'?'selected':''}>Bahasa Indonesia</option></select><label style="display:block;margin:15px 0;font-size:14px"><input type="checkbox" id="intensity" ${document.body.classList.contains('low')?'checked':''}> ${t('Reduce atmospheric intensity','Kurangi intensitas suasana')}</label><button class="primary" type="submit">${setup?t('Open case file','Buka berkas kasus'):t('Save settings','Simpan pengaturan')} </button></form><p class="hinttext">${t('Your player ID brings back your progress on any device. Save all five letters and three digits.','ID pemain kamu membuka kembali progres dari perangkat mana pun. Simpan kelima huruf serta ketiga angkanya.')}</p>`}
if(m.type==='welcome'){body=`<div class="welcome"><div style="width:90px;margin:0 auto 20px">${portrait(profile.avatar)}</div><div class="eyebrow">${t('ACCESS GRANTED','AKSES DIBERIKAN')}</div><h2>${t('Welcome to the Bureau,','Selamat datang di Biro Investigasi,')} ${t('Detective','Detektif')} ${esc(profile.name)}.</h2><p>${t('Eighteen standalone cases and a classified six-episode investigation await you. Every witness has a story. Every piece of evidence has a history. Your job is to discover what the facts can actually support.','Delapan belas kasus mandiri serta investigasi rahasia enam episode menunggu kamu. Setiap saksi membawa cerita, setiap bukti menyimpan jejak, dan tugas kamu adalah menemukan kesimpulan yang mampu dipertanggungjawabkan.')}</p><button class="primary" data-route="bureau">${t('Open my case files','Buka berkas kasus')} </button></div>`}
if(m.type==='about'){body=`<div class="eyebrow">${t('FIELD GUIDE','PANDUAN LAPANGAN')}</div><h2>${t('Think like an investigator.','Berpikir seperti detektif.')}</h2>${[[t('01 / Observe','01 / Amati'),t('Open the numbered scene hotspots. Read each source before forming a hypothesis.','Buka titik bernomor di lokasi. Baca setiap sumber sebelum membentuk hipotesis.')],[t('02 / Test','02 / Uji'),t('Review testimony. Select and confirm evidence-based deductions. Wrong answers can be retried; hints cost points.','Periksa keterangan. Pilih dan konfirmasi deduksi berbasis bukti. Jawaban salah bisa dicoba lagi; petunjuk mengurangi poin.')],[t('03 / Connect','03 / Hubungkan'),t('Pin records to your evidence board and connect clues. Keep facts separate from interpretations in your notebook.','Sematkan catatan di papan bukti dan hubungkan petunjuk. Pisahkan fakta dari tafsir dalam buku catatan.')],[t('04 / Conclude','04 / Simpulkan'),t('Complete every location to unlock the final theory. Submit each part to reveal the resolution and your report. Two investigations may be active at once.','Selesaikan setiap lokasi untuk membuka teori akhir. Kirim tiap bagian untuk melihat penyelesaian dan laporan kamu. Dua investigasi dapat aktif bersamaan.')]].map(([h,p])=>`<h3 style="font-size:25px;margin-top:25px">${h}</h3><p>${p}</p>`).join('')}`}

if(m.type==='compare'){wide=true;body=compareSources()}
if(m.type==='login'){body=`<div class="eyebrow">${t('WELCOME BACK','SELAMAT DATANG KEMBALI')}</div><h2>${t('Your next clue is waiting.','Petunjuk berikutnya menunggu.')}</h2><p>${t('Enter your full player ID to reopen your investigations.','Masukkan ID pemain lengkap untuk membuka kembali investigasi kamu.')}</p><form id="login-form"><label class="field-label" for="player-login">${t('Player ID · five letters + three digits','ID pemain · lima huruf + tiga angka')}</label><input id="player-login" class="field player-prefix" required pattern="[A-Za-z]{5}[0-9]{3}" maxlength="8" minlength="8" placeholder="PEARL042" autocomplete="username"><button class="primary">${t('Sign in','Masuk')}</button></form><button class="textbtn" data-action="settings">${profile.name?t('Back to my profile','Kembali ke profil saya'):t('Create a new investigator','Buat detektif baru')}</button>`}
if(m.type==='account-ready'){body=`<div class="eyebrow">${t('YOUR PLAYER ID','ID PEMAIN KAMU')}</div><h2 style="font-family:monospace;letter-spacing:5px">${esc(profile.username)}</h2><p>${t('Keep this ID private. Use it to return to your saved investigations from any device.','Simpan ID ini secara pribadi. Gunakan untuk kembali ke investigasi tersimpan dari perangkat mana pun.')}</p><div class="qactions"><button class="outline" data-action="download-id">${t('Save player ID','Simpan ID pemain')}</button><button class="primary" data-action="account-continue">${(pendingCase||current&&route==='workspace')?t('Open case file','Buka berkas kasus'):t('Enter the bureau','Masuk ke biro')}</button></div>`}
if(m.type==='network-node'){wide=true;const n=profile.network.nodes.find(x=>x.id===m.id);body=`<div class="eyebrow">${caseNo(n.id)} / ${n.code}</div><h2>${esc(tr(n.label))}</h2><p>${esc(tr(n.summary))}</p><p>${esc(n.people.join(' · '))}</p>${n.records.map(e=>`<article class="paper"><small>${e.id} · ${esc(tr(e.source))}</small><h3>${esc(tr(e.title))}</h3><p>${esc(tr(e.body))}</p></article>`).join('')}`}
if(m.type==='evidence'){const e=current.evidence.find(e=>e.id===m.id);wide=true;body=`<div class="paper" style="font-size:${m.zoom?22:17}px"><small>${t('DEDUCE / EVIDENCE RECORD','DEDUCE / CATATAN BUKTI')}<br>${e.id} · ${esc(tr(e.source))}</small><div class="rule"></div><h2>${esc(tr(e.title))}</h2><p style="font-size:inherit">${esc(tr(e.body))}</p><div class="stamp">${t('EXAMINED & RECORDED','DIPERIKSA & DICATAT')}</div></div><div class="qactions"><button class="outline" data-action="zoom">${t('Change text size','Ubah ukuran teks')} A</button><button class="primary" data-pin="${e.id}">${current.attempt.pins.includes(e.id)?t('Unpin from board','Lepas dari papan'):t('Pin to evidence board','Sematkan ke papan bukti')} ${icon('folder',16)}</button></div>`}
if(m.type==='interview'){const ch=current.characters.find(ch=>ch.id===m.id);body=`<div class="person" style="border:0"><div class="portrait" style="width:85px;height:100px">${portrait(current.characters.indexOf(ch)+current.case.id)}</div><div><small>${t('RECORDED TESTIMONY','KETERANGAN TEREKAM')}</small><h2 style="font-size:34px">${esc(ch.name)}</h2><p>${ch.age} · ${esc(tr(ch.role))}</p></div></div><p>${esc(tr(ch.background))}</p>${ch.transcript.map(d=>`<div class="feedback"><strong>${esc(interviewQuestions()[d.question])}</strong><p style="margin:8px 0 0">“${esc(tr(d.response))}”</p></div>`).join('')}<h3 style="font-size:24px;margin-top:25px">${esc(profile.name)}, ${t('what will you ask?','Apa yang akan kamu tanyakan?')}</h3>${interviewQuestions().map((q,i)=>`<button class="option" ${i===3&&ch.evidenceRef&&!current.attempt.inspected.includes(ch.evidenceRef)?'disabled':''} data-ask="${i}" data-character="${ch.id}"><b>${'ABCD'[i]}</b>${q}${i===3&&ch.evidenceRef&&!current.attempt.inspected.includes(ch.evidenceRef)?' · '+t('Inspect ','Periksa ')+ch.evidenceRef:''}${ch.transcript.some(d=>d.question===i)?' ✓':''}</button>`).join('')}`}
if(m.type==='manage'){body=`<div class="eyebrow">${t('YOUR INVESTIGATION DESK','MEJA INVESTIGASI KAMU')}</div><h2>${t('Two files at a time.','Dua berkas sekaligus.')}</h2><p>${t('Complete or archive a case to open a slot. Archived investigations keep every clue, answer and note.','Selesaikan atau arsipkan kasus untuk membuka slot. Investigasi yang diarsipkan tetap menyimpan setiap petunjuk, jawaban, dan catatan.')}</p>${profile.attempts.filter(a=>a.status==='ACTIVE'||a.status==='ARCHIVED').map(a=>`<div class="panel" style="margin-top:15px"><h3 style="font-size:25px">${esc(tr(profile.cases.find(c=>c.id===a.caseId).title))}</h3><small>${a.status==='ACTIVE'?t('ACTIVE','AKTIF'):t('ARCHIVED','DIARSIPKAN')} · ${a.inspected.length} ${t('EVIDENCE','BUKTI')}</small><div class="qactions">${a.status==='ACTIVE'?`<button class="outline" data-archive="${a.id}">${t('Archive case','Arsipkan kasus')}</button><button class="primary" data-attempt="${a.id}">${t('Continue','Lanjutkan')} </button>`:`<button class="primary" data-resume="${a.caseId}">${t('Resume case','Lanjutkan kasus')} </button>`}</div></div>`).join('')||`<p>${t('No investigations started yet.','Belum ada investigasi yang dimulai.')}</p>`}`}
if(m.type==='confirm'){body=`<div class="eyebrow">${t('CONFIRM YOUR DECISION','KONFIRMASI KEPUTUSAN KAMU')}</div><h2>${esc(m.title)}</h2><p>${esc(m.message)}</p><div class="qactions"><button class="outline" data-action="cancel">${t('Go back','Kembali')}</button><button class="primary" data-action="confirm">${t('Confirm','Konfirmasi')} </button></div>`}
if(m.type==='board'||m.type==='all-evidence'){wide=true;const a=current.attempt,items=current.evidence.filter(e=>a.inspected.includes(e.id));body=`<div class="eyebrow">${t('CASE NOTEBOOK','CATATAN KASUS')}</div><h2>${m.type==='board'?t('Connect the evidence.','Hubungkan bukti.'):t('The collected record.','Catatan yang terkumpul.')}</h2><p>${t('Pin documents in the viewer. Connections are your hypotheses, not automatically verified facts.','Sematkan dokumen dari penampil. Hubungan adalah hipotesis kamu, bukan fakta yang diverifikasi otomatis.')}</p><div class="board">${(m.type==='board'?items.filter(e=>a.pins.includes(e.id)):items).map(e=>`<button class="board-card" data-inspect="${e.id}"><small>${e.id}</small>${esc(tr(e.title))}</button>`).join('')||`<p>${t('Inspect and pin an evidence record to begin.','Periksa dan sematkan satu bukti untuk memulai.')}</p>`}</div>${items.length>1?`<form id="link-form"><div class="split" style="margin-top:20px">${[0,1].map(i=>`<select class="field" id="link-${i}" aria-label="${t('Evidence','Bukti')} ${i+1}">${items.map(e=>`<option value="${e.id}">${e.id} / ${esc(tr(e.title))}</option>`).join('')}</select>`).join('')}</div><button class="outline">${t('Connect two clues','Hubungkan dua petunjuk')} </button></form>`:''}${a.links.map(([x,y],i)=>`<div class="linked">${x}  ${y} <button data-unlink="${i}" aria-label="${t('Remove connection','Hapus hubungan')}">×</button></div>`).join('')}${items.length>1?`<h3 style="font-size:25px;margin-top:25px">${t('Compare sources','Bandingkan sumber')}</h3><div class="split">${items.slice(-2).map(e=>`<div class="panel"><small>${e.id}</small><strong style="display:block">${esc(tr(e.title))}</strong><p>${esc(tr(e.body))}</p></div>`).join('')}</div>`:''}`}
body=body.replace('<h2','<h2 id="modal-heading"');$('#overlay').innerHTML=`<div class="modal-backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-heading" aria-label="${t('Archive dialog','Dialog arsip')}"><button class="close" data-action="close" aria-label="${t('Close dialog','Tutup dialog')}">×</button>${body}</div></div>`;bind();}
async function enter(){if(!profile.name){avatar=0;openModal('onboard')}else setRoute('bureau')}
async function start(id,replay=false){if(!profile.name){pendingCase=id;avatar=0;openModal('onboard');return}viewerId=null;archiveExpanded=null;workspaceTab='evidence';const prior=[...profile.attempts].reverse().find(a=>a.caseId===id);if(prior?.status==='COMPLETED'&&!replay){await loadAttempt(prior.id);return}const v=await perform('start',{caseId:id},false);if(v){current=v;await setRoute('workspace')}else if(profile.attempts.filter(a=>a.status==='ACTIVE').length>=2)openModal('manage')}
async function loadAttempt(id){try{current=await api('view',{attempt:id});if(current.attempt.status==='ARCHIVED'){await start(current.case.id);return}setRoute('workspace')}catch(e){toast(e.message)}}
function bind(){
$$('[data-review-phase]').forEach(b=>b.onclick=async()=>{b.disabled=true;const v=await perform('reviewStage',{});if(v)toast(t('The records are open together.','Catatan terbuka bersama.'));else if(b.isConnected)b.disabled=false});
const hero=$('.hero-art');if(hero){let frame=0;hero.onpointermove=e=>{if(e.pointerType==='touch'||window.matchMedia?.('(prefers-reduced-motion:reduce)')?.matches)return;if(frame)return;frame=requestAnimationFrame(()=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--look-x',((e.clientX-r.left)/r.width-.5)*10+'px');hero.style.setProperty('--look-y',((e.clientY-r.top)/r.height-.5)*10+'px');frame=0})};hero.onpointerleave=()=>{hero.style.setProperty('--look-x','0px');hero.style.setProperty('--look-y','0px')}}
const archive=$('.archive-folder');if(archive)archive.ontoggle=()=>{archiveExpanded=archive.open};
const skip=$('.skip-link');if(skip)skip.textContent=t('Skip to content','Langsung ke konten');if(skip)skip.onclick=e=>{e.preventDefault();$('#app').focus()};
$$('button[data-workspace-tab]').forEach(b=>{b.onclick=async()=>{try{await flushNotes()}catch(e){toast(e.message);return}workspaceTab=b.dataset.workspaceTab;if(workspaceTab==='deduction'&&phaseSources().some(e=>!current.attempt.inspected.includes(e.id))){await perform('reviewStage',{});updateWorkspaceTab()}else updateWorkspaceTab();$('#view-'+workspaceTab)?.scrollIntoView({block:'start',behavior:'smooth'})};b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)||b.getAttribute('role')!=='tab')return;e.preventDefault();const keys=['evidence','notebook','deduction'],i=keys.indexOf(workspaceTab);workspaceTab=e.key==='Home'?keys[0]:e.key==='End'?keys[2]:keys[(i+(e.key==='ArrowRight'?1:2))%3];updateWorkspaceTab();$('#tab-'+workspaceTab)?.focus()}});
$$('[data-open-evidence]').forEach(b=>b.onclick=()=>openEvidence(b.dataset.openEvidence));
$$('[data-inline-pin]').forEach(b=>b.onclick=async()=>{const id=b.dataset.inlinePin,pins=[...current.attempt.pins],i=pins.indexOf(id);i<0?pins.push(id):pins.splice(i,1);await perform('notes',{pins})});
$$('[data-highlight]').forEach(b=>{b.onpointerdown=()=>{highlightDraft=window.getSelection()?.toString().trim()||''};b.onclick=async()=>{const quote=highlightDraft||window.getSelection()?.toString().trim(),id=b.dataset.highlight,e=current.evidence.find(e=>e.id===id);if(!quote||quote.length>1200||!tr(e.body).includes(quote))return toast(t('Select a passage of up to 1,200 characters within this evidence record first.','Pilih bagian hingga 1.200 karakter dalam catatan bukti ini dahulu.'));const highlights=[...(current.attempt.highlights||[])];if(highlights.length>=30)return toast(t('Your notebook holds up to 30 highlights. Remove one to save another.','Catatan kamu menampung hingga 30 sorotan. Hapus satu untuk menyimpan yang lain.'));if(!highlights.some(h=>h.evidence===id&&h.quote===quote))highlights.push({evidence:id,quote});await perform('notes',{highlights});highlightDraft='';toast(t('Passage saved in your notebook.','Bagian tersimpan dalam catatan kamu.'))}});
$$('[data-remove-highlight]').forEach(b=>b.onclick=()=>perform('notes',{highlights:(current.attempt.highlights||[]).filter((_,i)=>i!==Number(b.dataset.removeHighlight))}));
$$('[data-compare-select]').forEach(b=>b.onchange=()=>{const items=current.evidence.filter(e=>current.attempt.inspected.includes(e.id));modal.records=[$('#compare-0')?.value||items[0].id,$('#compare-1')?.value||items.at(-1).id];renderModal()});
$$('[data-preview]').forEach(b=>b.onclick=()=>{previewChoice=Number(b.dataset.preview);previewFeedback=null;$$('[data-preview]').forEach(x=>{const on=x===b;x.classList.toggle('selected',on);x.setAttribute('aria-checked',String(on));x.tabIndex=on?0:-1});$('[data-action="preview-confirm"]').disabled=false;$('#preview-feedback').innerHTML=''});
const search=$('#case-search');if(search)search.oninput=()=>{caseSearch=search.value;const results=$('#catalogue-results');if(results){results.innerHTML=cards();bind()}};
$$('[role="radio"]').forEach(b=>b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();const group=b.closest('[role="radiogroup"]')||b.closest('.question'),items=[...group.querySelectorAll('[role="radio"]')],i=items.indexOf(b),index=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:items.length-1))%items.length;items[index].click();setTimeout(()=>{const selector=b.dataset.question?'[data-question="'+b.dataset.question+'"][data-option="'+index+'"]':'[data-preview="'+index+'"]';$(selector)?.focus()},0)});

$$('[data-network-node]').forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.networkNode);if(await perform('networkReview',{node:id}))openModal('network-node',{id})});
$$('[data-net-q]').forEach(b=>b.onclick=()=>{selected[b.dataset.netQ]=Number(b.dataset.option);render()});

$$('[data-radio-play]').forEach(b=>b.onclick=()=>playRadio(Number(b.dataset.radioPlay)));

$$('[data-volume]').forEach(b=>b.onclick=()=>{selectedVolume=Number(b.dataset.volume);const y=scrollY;render();scrollTo(0,y)});

$$('[data-certificate]').forEach(b=>b.onclick=()=>certificate(Number(b.dataset.certificate)));

$$('[data-lang]').forEach(b=>b.onclick=async()=>{lang=b.dataset.lang;$('#notice').innerHTML='';localStorage.setItem('archive-language',lang);await perform('language',{language:lang},false);render()});

$$('[data-filter]').forEach(b=>b.onclick=()=>{selectedFilter=Number(b.dataset.filter);const y=scrollY;render();scrollTo(0,y)});

$$('[data-interview]').forEach(b=>b.onclick=()=>openModal('interview',{id:b.dataset.interview}));

$$('[data-pin]').forEach(b=>b.onclick=async()=>{const pins=[...current.attempt.pins],i=pins.indexOf(b.dataset.pin);i<0?pins.push(b.dataset.pin):pins.splice(i,1);const v=await perform('notes',{notes:current.attempt.notes,pins},false);if(v){current.attempt.pins=pins;render();renderModal()}});
